<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRAP</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="fbControl">
      <span>FB</span>
      <div id="fbSliderWrap">
        <input
          type="range"
          id="fbSlider"
          min="-1"
          max="1"
          step="0.01"
          value="0"
          autocomplete="off"
        />
      </div>
      <span id="fbValue">0.00</span>
    </div>
    <div id="hint">click</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
